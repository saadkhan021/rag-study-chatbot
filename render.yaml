services:
  - type: web
    name: learngenie-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard — don't commit real keys
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true  # Render generates a real random secret for you
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: FRONTEND_URL
        sync: false          # set after the frontend service exists (step 5 below)

  - type: web
    name: learngenie-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # set to the backend's Render URL BEFORE first build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # client-side routing (react-router) needs this